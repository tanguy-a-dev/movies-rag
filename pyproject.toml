[project]
name = "moviesrag"
version = "0.1.0"
description = "RAG movie recommendation system over TMDB data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.11.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.0",
    "kagglehub>=1.0.1",
    "pandas>=3.0.3",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.16",
    "ty>=0.0.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]