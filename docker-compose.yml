services:
  app:
    build: .
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    command: uvicorn src.api.client:app --host 0.0.0.0 --port 8000 --reload
  
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  chainlit:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    command: chainlit run ui/chainlit.py --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - app

volumes:
  qdrant_data:
  ollama_data: